<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f4f4f4;
        }

        .sidebar{
            height:100vh;
            background:#343a40;
            color:white;
            padding:20px;
        }

        .sidebar a{
            color:white;
            text-decoration:none;
            display:block;
            padding:10px;
            margin:5px 0;
        }

        .sidebar a:hover{
            background:#495057;
            border-radius:5px;
        }

        .card{
            box-shadow:0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar">
            <h3>Dashboard</h3>

            <a href="#">Home</a>
            <a href="#">Students</a>
            <a href="#">Exams</a>
            <a href="#">Results</a>
            <a href="#">Settings</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">

            <h2>Exam Admin Dashboard</h2>

            <div class="row mt-4">

                <!-- Card 1 -->
                <div class="col-md-4 mb-3">
                    <div class="card text-center p-3">
                        <h4>Total Students</h4>
                        <h2>1200</h2>
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="col-md-4 mb-3">
                    <div class="card text-center p-3">
                        <h4>Total Exams</h4>
                        <h2>35</h2>
                    </div>
                </div>

                <!-- Card 3 -->
                <div class="col-md-4 mb-3">
                    <div class="card text-center p-3">
                        <h4>Results Published</h4>
                        <h2>28</h2>
                    </div>
                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
